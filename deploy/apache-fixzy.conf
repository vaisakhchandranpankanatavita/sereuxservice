# Goes inside the existing <VirtualHost *:443> for techiova.serieux.in.
# DocumentRoot there must be /var/www/techiova.serieux.in/site, never the app folder.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass /api http://127.0.0.1:4001/api
ProxyPassReverse /api http://127.0.0.1:4001/api
<Directory /var/www/techiova.serieux.in/site>
    Options -Indexes +FollowSymLinks
    Require all granted
    DirectoryIndex index.html
</Directory>
RewriteEngine on
# Old .php links go to the clean address.
RewriteRule ^/([^./]+)\.php$ /$1 [R=301,L]
# Customer app pages (one path segment) are all served by index.html.
RewriteCond %{REQUEST_URI} !^/(api|admin|assets)(/|$)
RewriteRule ^/[^./]+/?$ /index.html [PT,L]
# File names don't change between builds, so browsers must re-check them.
<LocationMatch "^/(assets/build/.*|admin/|admin/index\.html|index\.html|[^./]*)$">
    Header set Cache-Control "no-cache"
</LocationMatch>
